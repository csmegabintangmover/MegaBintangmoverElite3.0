<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PT Mega Bintangmover Logistik</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#111;
color:white;
overflow-x:hidden;
}

/* NAVBAR */
nav{
position:fixed;
width:100%;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(8px);
}

nav h2{
color:white;
font-weight:700;
}

nav a{
color:white;
margin-left:25px;
text-decoration:none;
font-weight:500;
transition:0.3s;
}

nav a:hover{
color:#00bfff;
}

/* HERO SECTION (NO OVERLAY) */
.hero{
height:100vh;
background:url('truck.jpg') center/cover no-repeat;
display:flex;
align-items:center;
padding:0 80px;
}

.hero-content{
max-width:650px;
background:rgba(0,0,0,0.5);
padding:40px;
border-radius:15px;
animation:fadeUp 1.5s ease;
}

.hero h1{
font-size:52px;
font-weight:700;
}

.hero h2{
margin-top:15px;
color:#00bfff;
}

.hero p{
margin-top:20px;
font-size:18px;
}

/* LOWER HALF BACKGROUND */
.lower-background{
background:url('truck1.jpg') center/cover no-repeat;
padding:120px 20px;
}

/* BOX SECTION */
.box-section{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
margin-bottom:60px;
}

.box-card{
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
width:300px;
box-shadow:0 0 25px rgba(0,0,0,0.4);
transition:0.3s;
}

.box-card:hover{
transform:translateY(-10px);
}

.box-card h3{
margin-bottom:15px;
color:#00bfff;
}

.max-weight{
margin-top:15px;
font-weight:bold;
color:white;
}

/* BOOKING */
.booking-section{
display:flex;
justify-content:center;
}

.booking-form{
background:rgba(0,0,0,0.75);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
width:500px;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.booking-form h2{
text-align:center;
margin-bottom:20px;
color:#00bfff;
}

.booking-form input,
.booking-form select,
.booking-form textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;
}

.booking-form button{
width:100%;
padding:15px;
background:#00bfff;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.3s;
}

.booking-form button:hover{
background:#009acd;
}

/* WHATSAPP */
.wa-float{
position:fixed;
bottom:25px;
right:25px;
background:#25D366;
color:white;
font-size:28px;
padding:16px;
border-radius:50%;
text-decoration:none;
box-shadow:0 0 20px rgba(0,0,0,0.5);
transition:0.3s;
}

.wa-float:hover{
transform:scale(1.1);
}

/* ANIMATION */
@keyframes fadeUp{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

/* MOBILE */
@media(max-width:768px){
.hero{
padding:20px;
}
.hero h1{
font-size:34px;
}
.booking-form{
width:100%;
}
}

</style>
</head>

<body>

<nav>
<h2>Mega Bintangmover</h2>
<div>
<a href="#">Home</a>
<a href="#">Services</a>
<a href="#">Booking</a>
<a href="#">Contact</a>
</div>
</nav>

<section class="hero">
<div class="hero-content">
<h1>PT Mega Bintangmover Logistik</h1>
<h2>Full Truck Load (FTL)</h2>
<p>Fast • Safe • Nationwide Coverage</p>
</div>
</section>

<section class="lower-background">

<div class="box-section">
<div class="box-card">
<h3>BOX TYPE A</h3>
<p>Length: 6.9 m</p>
<p>Width: 2.1 m</p>
<p>Height: 2.1 m</p>
<p class="max-weight">Max 8,000 KG</p>
</div>

<div class="box-card">
<h3>BOX TYPE B</h3>
<p>Length: 2.0 m</p>
<p>Width: 2.2 m</p>
<p>Height: 2.3 m</p>
<p class="max-weight">Max 6,000 KG</p>
</div>
</div>

<div class="booking-section">
<div class="booking-form">
<h2>Booking Form</h2>
<input type="text" placeholder="Full Name">
<input type="text" placeholder="Pickup Address">
<input type="text" placeholder="Destination Address">
<input type="date">
<select>
<option>Select Box Type</option>
<option>Box Type A</option>
<option>Box Type B</option>
</select>
<textarea placeholder="Additional Notes"></textarea>
<button>Submit Booking</button>
</div>
</div>

</section>

<a href="https://wa.me/6282210110148" class="wa-float" target="_blank">💬</a>

</body>
</html>
